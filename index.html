      en: "Hi,\nI’m Gian Andrea Stragiotti.\nI fell in love with kiteboarding at the age of 9, and by 10, I discovered my passion for KiteFoil. The wind, the water, and this lifestyle have given me so much. Sharing this passion with people around the world is an incredible feeling. It’s all about those soul moments – gliding across the water or soaring through the air while feeling deeply connected to nature’s beauty.\nAfter competing internationally in Freestyle, I transitioned to Big Air and eventually to Formula Kite Racing, where I won the Youth World Champion title three years in a row. My ambition to win an Olympic medal at the Los Angeles 2028 Games demands relentless hard work, both physically and mentally. On this journey to LA 2028, I’m fortunate to have the support of many amazing partners, for which I’m extremely grateful.\nI’ll continue sharing the highs and lows, the glory, and the priveledged experiences of this journey on social media. Stay connected!",
      de: "Hey,\nIch bin Gian Andrea Stragiotti.\nIm Alter von 9 Jahren have ich mich in das Kitesurfen verliebt und mit 10 Jahren meine Leidenschaft für KiteFoil entdeckt. Der Wind, das Wasser und dieser Lebensstil bedeuten mir sehr viel. Diese Leidenschaft mit Menschen auf der ganzen Welt zu teilen, ist ein unglaubliches Gefühl. Es geht um die mystischen Momente - über das Wasser zu gleiten oder durch die Luft zu schweben und sich dabei tief mit der Schönheit der Natur verbunden zu fühlen.\nNachdem ich an internationalen Freestyle-Wettbewerben teilgenommen hatte, wechselte ich zum BigAir und schliesslich zum Formula Kite Racing, wo ich drei Jahre in Folge den Jugendweltmeistertitel gewann. Mein Ehrgeiz, bei den Spielen in Los Angeles 2028 eine olympische Medaille zu gewinnen, erfordert unermüdliche harte Arbeit, sowohl körperlich als auch mental. Auf meinem Weg nach LA 2028 habe ich das Glück, von vielen tollen Partnern unterstützt zu werden, wofür ich sehr dankbar bin.\nIch werde weiterhin die Höhen und Tiefen, die Erfolge und die privilegierten Erfahrungen dieser Reise in den sozialen Medien teilen. Stay connected!"

      { name: "Pro Kitesports", url: "https://prokitesports.ch", logo: "img/logo_prokitesports.png",

<style>
:root{--teal-rgb:0,61,76;--deep-rgb:6,34,43;--teal:#003d4c;--deep:#06222b;--ink:#0d1b20;--mut:#5f6f75;--line:#e6eaec;--soft:#f4f6f7;--or:#e8963a;--gold:#d4a73a;--silver:#aab4ba;--bronze:#b9774a}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;font-size:15px;color:var(--ink);background:#fff;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.disp{font-family:Jost,Inter,sans-serif;font-weight:300;letter-spacing:-.005em;line-height:1.05}
.uline{position:relative;padding-bottom:18px}.uline::after{content:"";position:absolute;left:0;bottom:0;width:46px;height:2px;background:var(--or)}
.kick{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--or)}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:60;height:84px;transition:background .3s,box-shadow .3s,height .3s}
header .in{max-width:1280px;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
header .logo{background:none;padding:0;opacity:.82;transition:opacity .3s}
header .logo:hover{opacity:1}
header .logo img{height:54px;width:auto}
header.solid{background:rgba(var(--deep-rgb),.55);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);box-shadow:0 1px 0 rgba(255,255,255,.08);height:72px}
header.solid .logo{padding:0}
header.solid .logo img{height:48px}
nav{display:flex;align-items:center;gap:6px}
nav a{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#fff;padding:8px 12px;position:relative;transition:color .2s}
header.solid nav a{color:#fff}
nav a[data-p]::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--or);transform:scaleX(0);transition:transform .25s}
nav a:hover::after,nav a.on::after{transform:scaleX(1)}
nav #lang{border:1px solid currentColor;border-radius:30px;padding:5px 12px;margin-left:8px;opacity:.85}
.burger{display:none;background:none;border:0;font-size:26px;color:#fff;cursor:pointer}
header.solid .burger{color:#fff}
@media(max-width:899px){.hero{height:88vh!important;min-height:560px!important}.hero .bg{background-position:44% 40%!important}.hero h1{font-size:30px!important;margin-bottom:12px!important}.hero .lines{font-size:10px!important;letter-spacing:.16em!important}.hero .wrap{padding-bottom:64px!important}}
@media(max-width:920px){nav{display:none;position:absolute;top:100%;left:0;right:0;background:rgba(var(--deep-rgb),.94);backdrop-filter:blur(14px);flex-direction:column;align-items:stretch;padding:12px 20px 20px;box-shadow:0 12px 30px rgba(0,0,0,.25)}nav a{color:#fff!important}nav.open{display:flex}.burger{display:block}}

.page{display:none}.page.on{display:block;animation:fade .5s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* page hero (subpages) */
.phero{position:relative;height:52vh;min-height:360px;max-height:580px;background-size:cover;background-position:center;display:flex;align-items:flex-end}
.phero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--deep-rgb),.55) 0%,rgba(var(--deep-rgb),.25) 40%,rgba(var(--deep-rgb),.85) 100%)}
.phero .wrap{position:relative;z-index:2;width:100%;padding-bottom:44px}
.phero h1{color:#fff;font-size:clamp(40px,5.4vw,72px);font-weight:200;position:relative;padding-bottom:18px}.phero h1::after{content:"";position:absolute;left:0;bottom:0;width:46px;height:2px;background:var(--or)}
.phero{filter:none}.phero[data-hdr="partners"]::before,.phero[data-hdr="gear"]::before,.phero[data-hdr="competition"]::before{display:none}.phero[data-hdr="partners"]{background-position:center 100%}.phero[data-hdr="gear"]{background-position:center 30%}.phero[data-hdr="competition"]{background-position:center 8%}#cbg{background-position:center 15%}.phero[data-hdr="partners"]::after,.phero[data-hdr="gear"]::after,.phero[data-hdr="competition"]::after{background:linear-gradient(180deg,rgba(var(--deep-rgb),.45) 0%,rgba(var(--deep-rgb),0) 35%,rgba(var(--deep-rgb),.1) 65%,rgba(var(--deep-rgb),.75) 100%)}.phero::before{content:"";position:absolute;inset:0;backdrop-filter:grayscale(1);-webkit-backdrop-filter:grayscale(1);z-index:1}.phero .wrap{z-index:3}.phero::after{z-index:2}
.phero .kick{display:block;margin-bottom:10px}

/* home hero */
.hero{position:relative;height:100vh;min-height:620px;display:flex;align-items:flex-end;justify-content:center;text-align:center;color:#fff;background:var(--deep);overflow:hidden}
.hero .bg{position:absolute;inset:-2%;background-size:cover;background-position:58% 45%;filter:grayscale(.2) contrast(1.05) brightness(.95);transform:scale(1.02);animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.07)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--deep-rgb),.5) 0%,rgba(var(--deep-rgb),0) 22%,rgba(var(--deep-rgb),0) 55%,rgba(var(--deep-rgb),.92) 100%)}
.hero .wrap{position:relative;z-index:2;width:100%;padding-bottom:84px}
@media(min-width:900px){.hero{justify-content:flex-end}.hero .wrap{text-align:right;max-width:1280px;margin:0 auto;padding-bottom:70px}.hero h1{font-size:clamp(34px,3.4vw,50px)!important;margin-bottom:14px!important}.hero .lines{font-size:12px!important;line-height:2!important}.hero .bg{background-position:30% 45%}.hero::after{background:linear-gradient(180deg,rgba(var(--deep-rgb),.5) 0%,rgba(var(--deep-rgb),0) 22%,rgba(var(--deep-rgb),0) 50%,rgba(var(--deep-rgb),.9) 100%),linear-gradient(90deg,rgba(var(--deep-rgb),0) 45%,rgba(var(--deep-rgb),.55) 100%)}}
.hero h1{font-size:clamp(38px,5vw,70px);font-weight:200;margin:0 0 22px;letter-spacing:.02em}
.hero h1 span{color:#fff}
.hero .lines{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.88);line-height:2.1}
.hero .lines b{font-weight:400;color:var(--or)}
.hero p.sub{display:none}
.scroll{position:absolute;z-index:2;left:50%;bottom:22px;transform:translateX(-50%);width:22px;height:36px;border:2px solid rgba(255,255,255,.6);border-radius:12px}
.scroll::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;background:#fff;border-radius:2px;transform:translateX(-50%);animation:sc 1.6s infinite}
@keyframes sc{0%{opacity:0;transform:translate(-50%,0)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,10px)}}

/* titles */
.honours{background:var(--deep);color:#fff;padding:110px 0}
.honours .hgrid{display:grid;grid-template-columns:1fr 1.05fr;gap:70px;align-items:center}
.tgroup+.tgroup{margin-top:48px}
.tgroup h2{font-size:clamp(30px,3.4vw,44px);margin-bottom:18px;font-weight:200}
.medal{display:flex;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.medal:last-child{border:0}
.medal i{flex:0 0 42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 16px Jost,Inter,sans-serif;position:relative;overflow:hidden;isolation:isolate}
.medal i::before{content:"";position:absolute;inset:3px;border-radius:50%;z-index:-1}
.medal i::after{content:"";position:absolute;top:-60%;left:-80%;width:50%;height:220%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:rotate(25deg);animation:sheen 4.5s ease-in-out infinite}
.medal:nth-child(3) i::after{animation-delay:.6s}.medal:nth-child(4) i::after{animation-delay:1.2s}.medal:nth-child(5) i::after{animation-delay:1.8s}
@keyframes sheen{0%,60%{left:-80%}85%,100%{left:140%}}
.medal i.g{background:conic-gradient(from 200deg,#fff6c9,#e9b93f,#a8761a,#f7dc84,#c8901f,#fff2b3,#e9b93f,#fff6c9);color:#4a3200;box-shadow:0 0 0 1px rgba(255,215,120,.5),0 4px 14px rgba(233,185,63,.45),inset 0 1px 2px rgba(255,255,255,.8)}
.medal i.g::before{background:radial-gradient(circle at 32% 28%,#fff8d6 0%,#f5d36b 28%,#d9a530 60%,#9c6b12 100%);box-shadow:inset 0 -2px 3px rgba(90,55,0,.35),inset 0 2px 3px rgba(255,255,255,.7)}
.medal i.s{background:conic-gradient(from 200deg,#ffffff,#b9c3ca,#6f7b83,#e6ebee,#8e9aa2,#ffffff,#b9c3ca,#ffffff);color:#26323a;box-shadow:0 0 0 1px rgba(220,228,233,.5),0 4px 14px rgba(190,205,215,.35),inset 0 1px 2px rgba(255,255,255,.9)}
.medal i.s::before{background:radial-gradient(circle at 32% 28%,#ffffff 0%,#e3e8eb 30%,#a9b4bb 62%,#6c7880 100%);box-shadow:inset 0 -2px 3px rgba(30,40,48,.3),inset 0 2px 3px rgba(255,255,255,.8)}
.medal i.b{background:conic-gradient(from 200deg,#ffe0c4,#c98250,#7d4420,#eab58b,#a3602f,#ffe0c4);color:#3a1a05;box-shadow:0 0 0 1px rgba(230,170,120,.45),0 4px 14px rgba(200,120,70,.35)}
.medal i.b::before{background:radial-gradient(circle at 32% 28%,#ffe6cf 0%,#e2a273 30%,#b06a38 62%,#6e3a17 100%);box-shadow:inset 0 -2px 3px rgba(60,25,5,.35),inset 0 2px 3px rgba(255,255,255,.6)}
.medal span{font-size:13px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.88)}
@media(max-width:860px){.honours .hgrid{grid-template-columns:1fr;gap:50px}}

/* slider */
.slider{position:relative;overflow:hidden;background:#000;border-radius:4px}
.slider .track{display:flex;height:100%;transition:transform .7s cubic-bezier(.65,0,.35,1)}
.slider .track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover}
.slider .nav{position:absolute;right:18px;bottom:18px;display:flex;gap:8px;z-index:2}
.slider button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(0,0,0,.25);backdrop-filter:blur(6px);color:#fff;font-size:20px;cursor:pointer;transition:.2s}
.slider button:hover{background:#fff;color:var(--ink)}
.slider .dots{position:absolute;left:20px;bottom:30px;display:flex;gap:6px;z-index:2}

.slider .dots b.on{width:34px;background:#fff}

.slider.full{height:min(60vw,680px);border-radius:0}

/* section heads */
.shead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:34px;flex-wrap:wrap}
.shead h2{font-size:clamp(34px,4vw,50px);color:var(--teal);position:relative;padding-bottom:18px}.shead h2::after{content:"";position:absolute;left:0;bottom:0;width:46px;height:2px;background:var(--or)}
.shead a.more{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);border-bottom:2px solid var(--or);padding-bottom:4px}

.insta{padding:110px 0 100px;background:var(--deep)}.insta .shead h2{color:#fff}.insta .shead a.more{color:#fff}

/* about */

let L="en";try{L=localStorage.getItem("lang")||"en"}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick=v=>(v&&typeof v==="object"&&!Array.isArray(v))?(v[L]||v.en||v.de):v;
const get=path=>path.split(".").reduce((o,k)=>o[k],SITE);
const medalClass=s=>s.includes("🥇")?"g":s.includes("🥈")?"s":s.includes("🥉")?"b":"";
const badge=n=>(n.source?`<span class="nsrc">${esc(n.source)}</span>`:"")+(n.video?`<span class="nplay"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>`:"");
const rankOf=line=>{const m=line.match(/^(\d+)(st|nd|rd|th)?\b[^,]*,\s*(.*)$/i);return m?{n:+m[1],rest:m[3]}:{n:null,rest:line}};

function sliders(){
  document.querySelectorAll(".slider").forEach(el=>{
    const imgs=get(el.dataset.slides);let i=0,t;
    el.innerHTML=`<div class="track">${imgs.map(s=>`<img src="${esc(s)}" alt="" loading="lazy">`).join("")}</div><div class="dots">${imgs.map(()=>"<b></b>").join("")}</div><div class="nav"><button aria-label="Previous">←</button><button aria-label="Next">→</button></div>`;
    const tr=el.querySelector(".track"),dots=[...el.querySelectorAll(".dots b")];
    const go=n=>{i=(n+imgs.length)%imgs.length;tr.style.transform=`translateX(-${i*100}%)`;dots.forEach((d,k)=>d.classList.toggle("on",k===i))};
    const [p,nx]=el.querySelectorAll(".nav button");
    const reset=()=>{clearInterval(t);t=setInterval(()=>go(i+1),5500)};
    p.onclick=()=>{go(i-1);reset()};nx.onclick=()=>{go(i+1);reset()};go(0);reset();
  });
}

function render(){
  const t=T[L];document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  $("nav").innerHTML=PAGES.map(p=>`<a href="#${p}" data-p="${p}">${t[p]}</a>`).join("")+`<a href="#" id="lang">${t.lang}</a>`;
  $("lang").onclick=e=>{e.preventDefault();L=L==="en"?"de":"en";try{localStorage.setItem("lang",L)}catch(_){};render();route()};
  $("nav").querySelectorAll("a[data-p]").forEach(a=>a.onclick=()=>$("nav").classList.remove("open"));

  $("herobg").style.backgroundImage=`url("${SITE.heroImage}")`;
  $("herolines").innerHTML=t.lines.map(l=>`<div>– ${l} –</div>`).join("");
  $("tiles").innerHTML=["about","competition","contact"].map(k=>[k,SITE.tiles[k]]).map(([p,img])=>`<a class="tile" href="#${p}"><span class="ti-im" style="background-image:url('${esc(img)}')"></span><span class="ti-lb">${t[p]}</span></a>`).join("");
  $("herosub").textContent=t.sub;
  $("titles").innerHTML=SITE.titles.map(x=>`<div class="tgroup"><h2 class="disp">${esc(pick(x.title))}</h2>${x.lines.map(l=>{const c=medalClass(l);const txt=l.replace(/[🥇🥈🥉]/gu,"").trim();return `<div class="medal"><i class="${c}">${c==="g"?1:c==="s"?2:c==="b"?3:""}</i><span>${esc(txt)}</span></div>`}).join("")}</div>`).join("");
  const ig=SITE.social.find(s=>s.icon==="ig");$("iglink").href=ig?ig.url:"#";
  $("insta").innerHTML=SITE.instagram.map(s=>`<a href="${esc(ig?ig.url:"#")}" target="_blank" rel="noopener"><img src="${esc(s)}" alt=""></a>`).join("");

  const N=SITE.news||[];
  $("newshome").style.display=N.length?"":"none";
  $("ncards").innerHTML=N.slice(0,3).map((n,i)=>`<a class="ncard reveal" href="${n.video&&n.link?esc(n.link):"#news"}" ${n.video&&n.link?'target="_blank" rel="noopener"':""} data-i="${i}"><div class="im">${badge(n)}<img src="${esc(n.image)}" alt=""></div><div class="b"><div class="ndate">${esc(n.date)}</div><h3 class="disp">${esc(pick(n.title))}</h3><p>${esc(pick(n.text)).replace(/\n/g," ")}</p></div></a>`).join("");
  $("posts").innerHTML=N.map((n,i)=>`<article class="post reveal" id="post-${i}"><div class="im">${n.image?(n.link&&n.video?`<a href="${esc(n.link)}" target="_blank" rel="noopener" style="display:block;position:relative">${badge(n)}<img src="${esc(n.image)}" alt=""></a>`:`<img src="${esc(n.image)}" alt="">`):""}</div><div><div class="ndate">${esc(n.date)}</div><h2 class="disp">${esc(pick(n.title))}</h2>${String(pick(n.text)).split("\n").map(p=>`<p>${esc(p)}</p>`).join("")}${n.link?`<a class="btn" href="${esc(n.link)}" target="_blank" rel="noopener">${esc(pick(n.linkText)||"Link")} →</a>`:""}</div></article>`).join("");

  document.querySelectorAll("[data-hdr]").forEach(e=>e.style.backgroundImage=`url("${SITE.pageHeaders[e.dataset.hdr]}")`);
  $("press").innerHTML=(SITE.press||[]).map(p=>`<a class="prs reveal" href="${esc(p.url)}" target="_blank" rel="noopener"><div class="pd">${esc(p.date)}</div><div><div class="ps">${esc(p.source)}</div><h4>${esc(p.title)}</h4><p>${esc(pick(p.text))}</p></div><span class="ar">↗</span></a>`).join("");
  $("abouttxt").innerHTML=String(pick(SITE.about.text)).split("\n").map(p=>`<p>${esc(p)}</p>`).join("");
  $("aboutpic").innerHTML=`<img src="${esc(SITE.about.image)}" alt="Gian Andrea Stragiotti">`;
  $("facts").innerHTML=SITE.about.facts.map(f=>`<div class="fact reveal"><svg viewBox="0 0 24 24">${ICONS[f.icon]||""}</svg><div class="t">${esc(pick(f.text)).replace(/\n/g,"<br>")}</div></div>`).join("");

  $("gear").innerHTML=SITE.gear.map(g=>`<div class="gcat"><div class="shead reveal"><h2 class="disp">${esc(g.cat)}</h2></div><div class="gitems">${g.items.map(i=>`<div class="gitem reveal"><div class="im"><img src="${esc(i.img)}" alt="${esc(i.name)}" loading="lazy"></div><span>${esc(i.name)}</span></div>`).join("")}</div></div>`).join("");

  $("caltitle").textContent=pick(SITE.calendarTitle);
  $("cal").innerHTML=SITE.calendar.map(([d,e])=>`<div class="crow reveal"><div class="d">${esc(d)}</div><div class="e">${esc(e)}</div></div>`).join("");
  $("acc").innerHTML=SITE.results.map((y,n)=>{const cnt=y.groups.reduce((a,g)=>a+g.lines.length,0);return `<div class="item${n===0?" open":""}"><div class="head"><span class="disp">${esc(y.year)}<small>${cnt} ${L==="de"?"Resultate":"results"}</small></span><b>+</b></div><div class="body">${y.groups.map(g=>`${g.title?`<div class="gt">${esc(g.title)}</div>`:""}${g.lines.map(l=>{const r=rankOf(l);const c=r.n===1?"g":r.n===2?"s":r.n===3?"b":"";return `<div class="rl"><span class="rk ${c}">${r.n?r.n+".":"–"}</span><p>${esc(r.rest)}</p></div>`}).join("")}`).join("")}</div></div>`}).join("");
  $("acc").querySelectorAll(".head").forEach(h=>h.onclick=()=>h.parentElement.classList.toggle("open"));

  $("pintro").textContent=pick(SITE.partnersIntro);
  $("plist").innerHTML=SITE.partners.map(g=>`<div class="pgroup"><div class="shead reveal"><h2 class="disp">${esc(pick(g.group))}</h2></div>${g.list.map(p=>`<div class="prow reveal"><a class="lg" href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.logo)}" alt="${esc(p.name)}"></a><div><h3 class="disp">${esc(p.name)}</h3><p>${esc(p[L]||p.en)}</p><a class="go" href="${esc(p.url)}" target="_blank" rel="noopener">${t.visit} →</a></div></div>`).join("")}</div>`).join("");

  $("addr").textContent=SITE.contact.address.split("\n").slice(1).join("\n");
  $("mail").textContent=SITE.contact.email;$("mail").href="mailto:"+SITE.contact.email;
  $("cbg").style.backgroundImage=`url("${SITE.contact.image}")`;
  $("cform").querySelectorAll("[name]").forEach(f=>f.placeholder=t.ph[f.name]);

  const big=["flysurfer","levitaz","oneill","skshapes"];
  const all=SITE.partners.flatMap(g=>g.list);
  $("strip").innerHTML=SITE.logoStrip.map(k=>{const p=all.find(x=>x.logo.includes("logo_"+k+"."));return p?`<a href="${esc(p.url)}" target="_blank" rel="noopener"><img class="${big.includes(k)?"big":""}" src="${esc(p.logo)}" alt="${esc(p.name)}"></a>`:""}).join("");
  $("soc").innerHTML=SITE.social.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.name)}"><svg viewBox="0 0 24 24">${SOC[s.icon]||""}</svg></a>`).join("");
  $("credit").innerHTML=`<a href="mailto:${esc(SITE.contact.email)}">${esc(SITE.credit)}</a>`;
  $("yr").textContent=new Date().getFullYear();
  observe();
}
let io;
function observe(){
  if(!("IntersectionObserver" in window)){document.querySelectorAll(".reveal").forEach(e=>e.classList.add("in"));return}
  io&&io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
  document.querySelectorAll(".page.on .reveal:not(.in)").forEach(e=>io.observe(e));
}
function slots(){
  const S=[],add=(label,hint,get,set)=>S.push({label,hint,get});
  const sec=t=>S.push({sec:t});
  sec("Startseite");
  add("Titelbild Startseite (gross)","Quer, sehr breit",()=>SITE.heroImage);
  SITE.homeSlider.forEach((x,i)=>add(`Startseite Foto-Slider ${i+1}/${SITE.homeSlider.length}`,"Quer",()=>SITE.homeSlider[i]));
  sec("Header-Bilder der Unterseiten");
  [["news","News"],["about","About / Über mich"],["gear","Material"],["competition","Wettkämpfe"],["partners","Partner"]].forEach(([k,n])=>add(`Header ${n}`,"Quer, breit",()=>SITE.pageHeaders[k]));
  add("Header Kontakt","Quer, breit",()=>SITE.contact.image);
  sec("About");
  add("Porträt About","Hoch",()=>SITE.about.image);
  SITE.about.slider.forEach((x,i)=>add(`About Foto-Slider ${i+1}/${SITE.about.slider.length}`,"Quer",()=>SITE.about.slider[i]));
  sec("Wettkämpfe");
  SITE.competitionSlider.forEach((x,i)=>add(`Wettkampf Foto-Slider ${i+1}/${SITE.competitionSlider.length}`,"Quer",()=>SITE.competitionSlider[i]));
  sec("News-Beiträge");
  (SITE.news||[]).forEach((n,i)=>add(`News: ${pick(n.title)}`,"Quer",()=>n.image));
  sec("Instagram-Raster (optional)");
  SITE.instagram.forEach((x,i)=>add(`Instagram ${i+1}/${SITE.instagram.length}`,"Quadrat",()=>SITE.instagram[i]));
  sec("Material (optional, Produktbilder)");
  SITE.gear.forEach(g=>g.items.forEach(it=>add(`${g.cat}: ${it.name}`,"Freigestellt, weisser Hintergrund",()=>it.img)));
  let n=0;
  $("slots").innerHTML=S.map(s=>s.sec?`<div class="slot sec">${esc(s.sec)}</div>`:`<div class="slot"><span class="no">${++n}</span><img src="${esc(s.get())}" alt="" loading="lazy"><div class="lb">${esc(s.label)}<small>${esc(s.hint)}</small></div></div>`).join("");
}
function route(){
  const h=location.hash.slice(1);
  const p=(PAGES.includes(h)||h==="bilder")?h:"home";
  [...PAGES,"bilder"].forEach(x=>$("p-"+x).classList.toggle("on",x===p));
  if(p==="bilder")slots();
  document.querySelectorAll("#nav a[data-p]").forEach(a=>a.classList.toggle("on",a.dataset.p===p));
  window.scrollTo(0,0);onScroll();observe();
}
function onScroll(){ $("hdr").classList.toggle("solid",window.scrollY>40||location.hash==="#bilder") }
window.addEventListener("scroll",onScroll,{passive:true});
$("cform").addEventListener("submit",e=>{
  e.preventDefault();const f=new FormData(e.target);
  const body=`${f.get("message")}\n\n${f.get("name")} (${f.get("mail")})`;
  $("cnote").textContent=T[L].sent+SITE.contact.email;
  try{window.location.href=`mailto:${SITE.contact.email}?subject=${encodeURIComponent(f.get("subject")||"Website")}&body=${encodeURIComponent(body)}`}catch(_){}
});
window.addEventListener("hashchange",route);
render();sliders();route();
</script>
